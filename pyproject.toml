[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch17p13"
version = "0.1.0"
description = "Classify 17p13.1 TP53/WRAP53 structural-variant architecture from a VCF"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rinat Rizvanov" }]
keywords = ["genomics", "structural-variants", "TP53", "WRAP53", "TCAB1", "osteosarcoma"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
# Runtime dependencies are intentionally empty. See SCOPE.md.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arch17p13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["arch17p13"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/arch17p13", "tests"]
